<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="style.css">

    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-objects.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/small-chicken.class.js"></script>
    <script src="models/sound-manager.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/background-objects.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/salsa-bottle.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/status-bar-health.class.js"></script>
    <script src="models/status-bar-coin.class.js"></script>
    <script src="models/status-bar-bottle.class.js"></script>
    <script src="models/status-bar-endboss.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/game.js"></script>
</head>
<body>
    <h1>El Pollo Loco</h1>
    <div id="container">
        <canvas id="canvas" width="720" height="480"></canvas>
        <div id="start-screen" class="start-screen-overlay">
            <img src="img/9_intro_outro_screens/start/startscreen_1.png" alt="Start Screen">
            <div onclick="startGame()" class="start-btn">START GAME</div>
        </div>

        <div id="game-over-screen" class="d-none">
            <img src="img/9_intro_outro_screens/game_over/game%20over!.png" alt="game over screen">
            <div onclick="window.location.reload()" class="restart-btn">Try Again!</div>
        </div>

        <div id="win-screen" class="d-none">
            <img src="img/You won, you lost/You Win A.png" alt="won screen">
            <div onclick="window.location.reload()" class="restart-btn">Play Again!</div>
        </div>
    </div>
</body>
</html>
